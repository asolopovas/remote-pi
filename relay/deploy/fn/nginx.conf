worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    limit_req_zone $binary_remote_addr zone=requests:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    server {
        listen 8080;
        server_name 173.208.50.216;
        location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
            root /var/www/acme;
            default_type text/plain;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name 173.208.50.216;
        ssl_certificate /etc/relay-tls/current/fullchain.pem;
        ssl_certificate_key /etc/relay-tls/current/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        client_max_body_size 500k;
        client_body_timeout 15s;
        client_header_timeout 15s;
        limit_req zone=requests burst=50 nodelay;
        limit_conn connections 50;
        location / {
            proxy_pass http://relay:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # Override, never trust client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Relay sends ping every 25 seconds.
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
